[project]
name = "outlook-ews-mcp"
version = "0.1.0"
description = "OAuth2 protected Exchange EWS MCP and local Keycloak acceptance stand"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.0,<4",
  "exchangelib>=5.6,<6",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

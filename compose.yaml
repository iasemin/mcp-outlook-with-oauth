name: outlook-lab
services:
  litellm-ingress:
    image: nginx:1.28.3-alpine
    ports:
      - 127.0.0.1:8400:8080
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [litellm]
    mem_limit: 64m
    restart: unless-stopped
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${LAB_POSTGRES_PASSWORD:?run scripts/init_lab.py}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped
    networks:
      default:
        aliases: [outlook-keycloak-db]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://outlook-keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${LAB_POSTGRES_PASSWORD}
      KC_HOSTNAME: http://localhost:8800
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD}
    ports:
      - 127.0.0.1:8800:8080
    volumes:
      - ./.local/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      litellm:
        aliases: [outlook-keycloak]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\r\n\r\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped
  mcp:
    build: .
    image: outlook-ews-mcp:local
    environment:
      OUTLOOK_BACKEND: demo
      OUTLOOK_ISSUER: http://localhost:8800/realms/outlook-lab
      OUTLOOK_JWKS_URI: http://keycloak:8080/realms/outlook-lab/protocol/openid-connect/certs
      OUTLOOK_AUDIENCE: outlook-mcp
      OUTLOOK_PUBLIC_URL: http://localhost:8766
      OUTLOOK_MAPPING_FILE: /run/config/mailboxes.json
    volumes:
      - ./.local/mailboxes.json:/run/config/mailboxes.json:ro
    ports:
      - 127.0.0.1:8766:8766
    networks:
      default: {}
      litellm:
        aliases: [outlook-mcp]
    depends_on:
      keycloak:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    restart: unless-stopped
networks:
  litellm:
    external: true
    name: ${LITELLM_NETWORK:-litellm_guardrails_default}
volumes:
  keycloak-db:
